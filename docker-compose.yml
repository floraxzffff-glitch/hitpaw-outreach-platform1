version: '3.9'

services:
  # ======================== FastAPI 后端 ========================
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: vikpea-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://vikpea:vikpea123@db:5432/vikpea
      - REDIS_URL=redis://cache:6379/0
      - CELERY_BROKER_URL=redis://cache:6379/1
      - CELERY_RESULT_BACKEND=redis://cache:6379/2
      - WORKSPACE_DIR=/app/workspace
    depends_on:
      - db
      - cache
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./workspace:/app/workspace
    networks:
      - vikpea-network
    restart: unless-stopped

  # ======================== PostgreSQL 数据库 ========================
  db:
    image: postgres:15-alpine
    container_name: vikpea-db
    environment:
      - POSTGRES_USER=vikpea
      - POSTGRES_PASSWORD=vikpea123
      - POSTGRES_DB=vikpea
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vikpea-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vikpea"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================== Redis 缓存 ========================
  cache:
    image: redis:7-alpine
    container_name: vikpea-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vikpea-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================== Next.js 前端 ========================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # NEXT_PUBLIC_* 变量在 next build 时被写死进 JS 产物，
        # 必须作为构建参数传入，运行时改环境变量无效
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: vikpea-frontend
    ports:
      - "3000:3000"
    environment:
      # 浏览器访问的 API 地址（需根据实际部署修改）
      # 本地开发: http://localhost:8000
      # 生产环境: http://你的域名或IP:8000 或使用 nginx 反向代理
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - vikpea-network
    restart: unless-stopped

  # ======================== Nginx 反向代理（可选） ========================
  nginx:
    image: nginx:latest
    container_name: vikpea-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - vikpea-network
    restart: unless-stopped

  # ======================== Adminer（数据库管理，开发用） ========================
  adminer:
    image: adminer:latest
    container_name: vikpea-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - vikpea-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  vikpea-network:
    driver: bridge
