version: '3.9'

services:
  # ======================== FastAPI 后端 ========================
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: vikpea-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://vikpea:vikpea123@db:5432/vikpea
      - REDIS_URL=redis://cache:6379/0
      - CELERY_BROKER_URL=redis://cache:6379/1
      - CELERY_RESULT_BACKEND=redis://cache:6379/2
    depends_on:
      - db
      - cache
    volumes:
      - ./api:/app
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./data:/app/data
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - vikpea-network
    restart: unless-stopped

  # ======================== PostgreSQL 数据库 ========================
  db:
    image: postgres:15-alpine
    container_name: vikpea-db
    environment:
      - POSTGRES_USER=vikpea
      - POSTGRES_PASSWORD=vikpea123
      - POSTGRES_DB=vikpea
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vikpea-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vikpea"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================== Redis 缓存 ========================
  cache:
    image: redis:7-alpine
    container_name: vikpea-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vikpea-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================== Next.js 前端 ========================
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: vikpea-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/.next
    networks:
      - vikpea-network
    restart: unless-stopped

  # ======================== Nginx 反向代理（可选） ========================
  nginx:
    image: nginx:latest
    container_name: vikpea-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - vikpea-network
    restart: unless-stopped

  # ======================== Adminer（数据库管理，开发用） ========================
  adminer:
    image: adminer:latest
    container_name: vikpea-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - vikpea-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  vikpea-network:
    driver: bridge
